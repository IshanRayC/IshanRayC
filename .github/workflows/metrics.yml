name: GitHub Metrics

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Get the repository so we can modify the generated SVG
      # and commit the final version.
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Generate the original isometric calendar.
      #
      # IMPORTANT:
      # output_action: none
      #
      # This prevents lowlighter/metrics from committing its
      # default GREEN SVG before our recoloring step runs.
      # -------------------------------------------------------

      - name: Generate 3D contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: IshanRayC
          filename: assets/metrics.isocalendar.svg
          base: ""
          config_timezone: Asia/Kolkata

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          output_action: none

      # -------------------------------------------------------
      # Recolor GREEN contribution cubes to:
      #
      # #071A2F
      # #0B3554
      # #12658A
      # #1597B8
      # #1FA8C2
      #
      # We detect GREEN by RGB characteristics instead of
      # relying only on specific GitHub hex values.
      #
      # This makes the recoloring robust if Metrics changes
      # the exact source green shades.
      # -------------------------------------------------------

      - name: Recolor contribution cubes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("assets/metrics.isocalendar.svg")

          if not path.exists():
              raise SystemExit(
                  "metrics.isocalendar.svg was not generated"
              )

          text = path.read_text(
              encoding="utf-8"
          )

          # Darkest -> brightest.
          palette = [
              (0x07, 0x1A, 0x2F),  # deep navy
              (0x0B, 0x35, 0x54),  # dark blue
              (0x12, 0x65, 0x8A),  # blue
              (0x15, 0x97, 0xB8),  # cyan-blue
              (0x1F, 0xA8, 0xC2),  # bright cyan
          ]

          def replacement(match):
              original = match.group(0)

              r = int(original[1:3], 16)
              g = int(original[3:5], 16)
              b = int(original[5:7], 16)

              # Only target green shades.
              #
              # Green contribution colors have:
              #   G > R
              #   G > B
              #
              # and a meaningful saturation difference.
              is_green = (
                  g > r * 1.20
                  and g > b * 1.08
                  and (g - r) >= 18
              )

              if not is_green:
                  return original

              # Estimate brightness of the original green.
              brightness = (
                  0.2126 * r
                  + 0.7152 * g
                  + 0.0722 * b
              ) / 255.0

              # Map brightness into our 5-level palette.
              index = min(
                  4,
                  max(
                      0,
                      int(round(brightness * 4))
                  )
              )

              nr, ng, nb = palette[index]

              return (
                  f"#{nr:02X}"
                  f"{ng:02X}"
                  f"{nb:02X}"
              )

          recolored = re.sub(
              r"#[0-9A-Fa-f]{6}",
              replacement,
              text
          )

          path.write_text(
              recolored,
              encoding="utf-8"
          )

          print(
              "Recolored green contribution "
              "cubes to the blue palette."
          )

      # -------------------------------------------------------
      # Commit ONLY the final recolored SVG.
      # -------------------------------------------------------

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/metrics.isocalendar.svg

          if git diff --cached --quiet; then
            echo "No calendar changes detected."
            exit 0
          fi

          git commit -m "Update blue 3D contribution calendar"
          git push
