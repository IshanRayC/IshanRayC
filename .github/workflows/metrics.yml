name: GitHub Metrics

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: IshanRayC
          filename: assets/metrics.isocalendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Recolor contribution cubes
        shell: python
        run: |
          from pathlib import Path

          path = Path("assets/metrics.isocalendar.svg")

          if not path.exists():
              raise SystemExit(
                  "metrics.isocalendar.svg was not generated"
              )

          text = path.read_text(encoding="utf-8")

          colors = [
              "#071A2F",
              "#0B3554",
              "#12658A",
              "#1597B8",
              "#1FA8C2",
          ]

          replacements = {
              "#ebedf0": colors[0],
              "#9be9a8": colors[1],
              "#40c463": colors[2],
              "#30a14e": colors[3],
              "#216e39": colors[4],
              "#EBEDF0": colors[0],
              "#9BE9A8": colors[1],
              "#40C463": colors[2],
              "#30A14E": colors[3],
              "#216E39": colors[4],
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")

          print("Recolored isometric calendar.")

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/metrics.isocalendar.svg

          if git diff --cached --quiet; then
            echo "No calendar changes detected."
            exit 0
          fi

          git commit -m "Update 3D contribution calendar"
          git push
