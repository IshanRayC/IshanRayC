name: Generate Dot Matrix Portrait

on:
  push:
    branches:
      - main
    paths:
      - "assets/portrait-source.png"
      - "scripts/dotify.py"
      - ".github/workflows/dotmatrix.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

            - name: Generate dot matrix portrait
        run: |
          python scripts/dotify.py \
            assets/portrait-source.png \
            --out assets/portrait.svg \
            --cols 220 \
            --cell 4.5 \
            --dot-scale 0.92 \
            --fall-duration 1.10 \
            --row-spread 3.20 \
            --seed 42
            
      - name: Commit generated portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/portrait.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Generate dot matrix portrait"
          git push
