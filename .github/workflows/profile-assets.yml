name: Refresh Profile Assets
on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/generate_profile_assets.py
      - .github/workflows/profile-assets.yml
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-assets
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_profile_assets.py
      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-activity-dark.svg assets/profile-activity-light.svg assets/projects-dark.svg assets/projects-light.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(profile): refresh cyan stats and projects"
          git pull --rebase origin main
          git push origin HEAD:main
