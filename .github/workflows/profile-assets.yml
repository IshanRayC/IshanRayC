name: Refresh Profile Assets

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/generate_profile_assets.py
      - .github/workflows/profile-assets.yml
      - assets/portrait.svg
  schedule:
    # Refresh every 30 minutes so commits, PRs, issues, streaks, and top languages stay current.
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SVG font tooling
        run: python3 -m pip install --quiet fonttools

      - name: Generate, sync, and publish profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5 6; do
            echo "Profile asset publish attempt $attempt/3"

            # Always regenerate from the newest main so this workflow cannot
            # overwrite a newer commit from another profile workflow/action.
            git fetch origin main
            git reset --hard origin/main

            python3 scripts/generate_profile_assets.py

            # Publish a new path for the hero so GitHub cannot keep serving a cached old SVG.
            cp assets/hero-dark.svg assets/hero-v2-dark.svg
            cp assets/hero-light.svg assets/hero-v2-light.svg

            git add               assets/profile-activity-dark.svg               assets/profile-activity-light.svg               assets/projects-dark.svg               assets/projects-light.svg               assets/hero-dark.svg               assets/hero-light.svg               assets/hero-v2-dark.svg               assets/hero-v2-light.svg               assets/signature-stripe-dark.svg               assets/signature-stripe-light.svg               assets/featured-work-dark.svg               assets/featured-work-light.svg               assets/featured-top-dark.svg               assets/featured-top-light.svg               assets/featured-vitalwatch-band-dark.svg               assets/featured-vitalwatch-band-light.svg               assets/featured-mcp-band-dark.svg               assets/featured-mcp-band-light.svg               assets/featured-simple-calc-band-dark.svg               assets/featured-simple-calc-band-light.svg

            if git diff --cached --quiet; then
              echo "Generated assets are already up to date."
              exit 0
            fi

            git commit -m "chore(profile): refresh cyan profile visuals"

            # Re-sync immediately before pushing so brief concurrent profile commits do not cause a false failure.
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Profile assets published successfully."
              exit 0
            fi

            echo "Push raced with another writer; syncing and retrying..."
            git rebase --abort || true
            git reset --hard origin/main
            sleep 2
          done

          echo "Failed to publish profile assets after 6 attempts."
          exit 1
